<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Persons Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-5">

    <h1 class="mb-4">Persons</h1>

    <div id="persons" class="mb-5"></div>

    <h2>Add / Edit Person</h2>

    <form id="personForm" class="row g-3">
        <div class="col-md-6">
            <label for="firstname" class="form-label">First name</label>
            <input type="text" id="firstname" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="lastname" class="form-label">Last name</label>
            <input type="text" id="lastname" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="birthdate" class="form-label">Birthdate</label>
            <input type="date" id="birthdate" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" class="form-select" required>
                <option value="">Choose...</option>
                <option value="M">M</option>
                <option value="F">F</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="firstRegistration" class="form-label">First registration</label>
            <input type="date" id="firstRegistration" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="celular" class="form-label">Cellular</label>
            <input type="text" id="celular" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" id="phone" class="form-control" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
        </div>
    </form>

    <script src="script.js"></script>

</body>
</html>
